name: Android APK Build
# Native map renderer: MapLibre

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
      - tech/stabilize-android-dispatch-2026-11-23
  push:
    branches:
      - main
      - tech/stabilize-android-dispatch-2026-11-23
      - fix/order-submit-diagnostics-2026-11-24
    paths:
      - '**'
      - '!README.md'

concurrency:
  group: ladygo-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build LadyGo APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      EXPO_PUBLIC_GEOAPIFY_API_KEY: ${{ secrets.GEOAPIFY_API_KEY }}
      EXPO_PUBLIC_PROTOMAPS_STYLE_URL: ${{ secrets.PROTOMAPS_STYLE_URL }}
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL || secrets.SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY || secrets.SUPABASE_ANON_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Generate Android project
        run: CI=1 npx expo prebuild --platform android

      - name: Configure Gradle plugin repositories
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("android/settings.gradle")
          content = path.read_text()
          marker = "pluginManagement {"
          if marker not in content:
              raise SystemExit("pluginManagement block is missing from android/settings.gradle")
          repositories = """pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
                  maven { url "https://maven-central.storage-download.googleapis.com/maven2/" }
              }
          """
          content = content.replace(marker, repositories, 1)
          path.write_text(content)
          print("Configured plugin repositories")
          PY

      - name: Configure QA APK signing
        run: |
          # This CI signing identity is only for sideloaded QA builds, never Google Play production releases.
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000
          fi
          python3 - <<'PY'
          from pathlib import Path
          import re
          path = Path("android/app/build.gradle")
          content = path.read_text()
          build_types = re.search(r"\bbuildTypes\s*\{", content)
          if not build_types:
              raise SystemExit("android buildTypes block not found")
          release = re.search(r"\brelease\s*\{", content[build_types.end():])
          if not release:
              raise SystemExit("release build type not found")
          start = build_types.end() + release.end()
          close = content.find("\n        }", start)
          if close < 0:
              close = content.find("\n    }", start)
          if close < 0:
              raise SystemExit("release build type closing brace not found")
          block = content[start:close]
          if "signingConfig signingConfigs.debug" not in block:
              content = content[:start] + "\n            signingConfig signingConfigs.debug" + content[start:]
              path.write_text(content)
          print("Release APK configured with CI debug signing (QA only)")
          PY

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Verify APK signature
        run: |
          APK="android/app/build/outputs/apk/release/app-release.apk"
          APKSIGNER="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          if [ -z "$APKSIGNER" ]; then echo "apksigner not found"; exit 1; fi
          "$APKSIGNER" verify --verbose --print-certs "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LadyGo-Android-APK
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
