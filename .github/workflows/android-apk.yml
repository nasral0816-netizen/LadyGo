name: Android APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '**'
      - '!README.md'

permissions:
  contents: read

jobs:
  build:
    name: Build LadyGo APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Generate Android project
        run: CI=1 npx expo prebuild --platform android

      - name: Add Maven Central mirror
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("android/settings.gradle")
          text = path.read_text()
          marker = "repositories {"
          if marker not in text:
              raise SystemExit("Could not find repositories block in android/settings.gradle")
          mirror = 'repositories {\n        maven { url "https://maven-central.storage-download.googleapis.com/maven2/" }'
          text = text.replace(marker, mirror)
          path.write_text(text)
          PY

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LadyGo-Android-APK
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
