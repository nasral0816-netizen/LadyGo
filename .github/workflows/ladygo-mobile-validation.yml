name: LadyGo mobile validation

on:
  push:
    branches: [main, ladygo-2.0]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  android-bundle:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate Expo configuration
        run: npx expo config --type public
        env:
          EXPO_PUBLIC_SUPABASE_URL: https://example.supabase.co
          EXPO_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_ci_placeholder
      - name: Export Android JavaScript bundle
        run: npx expo export --platform android --output-dir dist
        env:
          EXPO_PUBLIC_SUPABASE_URL: https://example.supabase.co
          EXPO_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_ci_placeholder
