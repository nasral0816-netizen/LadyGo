name: Build LadyGo Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify Expo project
        run: npx expo config --type public

      - name: Install EAS CLI
        run: npm install --global eas-cli

      - name: Build installable Android APK
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::Add an Expo access token as the GitHub Actions secret EXPO_TOKEN, then run this workflow again."
            exit 1
          fi
          eas build --platform android --profile apk --non-interactive --wait
