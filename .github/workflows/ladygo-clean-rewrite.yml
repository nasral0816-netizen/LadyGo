name: LadyGo clean rewrite validation

on:
  push:
    branches:
      - main
      - ladygo-clean-rewrite
      - tech/stabilize-android-dispatch-2026-11-23
  pull_request:
    branches:
      - main

concurrency:
  group: ladygo-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  android-export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Validate LadyGo security and dispatch contracts
        run: node scripts/validate-ladygo.mjs
      - name: Setup Deno for Supabase Edge Function checks
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check Supabase Edge Functions
        run: |
          deno check supabase/functions/pricing-service/index.ts
          deno check supabase/functions/dispatch-loop/index.ts
          deno check supabase/functions/send-driver-offer-push/index.ts
          deno check supabase/functions/payment-service/index.ts
      - name: Validate Expo config
        run: npx expo config --type public
      - name: Check Expo dependency compatibility
        run: npx expo-doctor
      - name: Export Android bundle
        run: npx expo export --platform android
